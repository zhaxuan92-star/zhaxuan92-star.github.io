<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>WorldForge Mobile — Fantasy Map Studio</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1220;color:#eef4ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit}
.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
header{height:56px;background:#111b2e;border-bottom:1px solid #2b3b55;display:flex;align-items:center;padding:6px 10px;gap:8px;z-index:5}
.logo{font-weight:800;letter-spacing:.3px;white-space:nowrap}.logo span{color:#67e8f9}
.top-actions{display:flex;gap:6px;margin-left:auto}
button,.filelabel{border:1px solid #344863;background:#18243a;color:#eaf2ff;border-radius:10px;padding:9px 11px;cursor:pointer;touch-action:manipulation}
button:active,.filelabel:active{transform:scale(.97);background:#22324d}
.primary{background:#075985;border-color:#0e7490}
main{position:relative;min-height:0;overflow:hidden}
#map{width:100%;height:100%;display:block;background:#152235;touch-action:none}
.toolbar{position:absolute;left:10px;top:10px;width:min(230px,calc(100% - 20px));background:#111b2eeF;border:1px solid #334760;border-radius:14px;padding:8px;backdrop-filter:blur(10px);z-index:4}
.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.toolgrid button{padding:10px 7px;font-size:13px}
.toolgrid button.active{outline:2px solid #67e8f9;background:#153a4c}
.control{margin-top:8px;padding:8px;background:#0c1525;border-radius:10px}
.control label{display:block;font-size:11px;color:#a9b8cc;margin-bottom:5px}
input[type=range]{width:100%}
#color{width:100%;height:36px;padding:2px;border:0;background:none}
#name{width:100%;background:#17243a;border:1px solid #344863;color:white;border-radius:8px;padding:8px}
.panel{position:absolute;right:10px;top:10px;width:min(280px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;background:#111b2eeF;border:1px solid #334760;border-radius:14px;padding:10px;backdrop-filter:blur(10px);z-index:4;display:none}
.panel.open{display:block}
.panel h3{margin:2px 0 9px;font-size:15px}.row{display:flex;gap:6px}.row>*{flex:1}
.small{font-size:11px;color:#9fb0c7}.switch{display:flex;gap:8px;align-items:center}
.status{position:absolute;left:10px;bottom:10px;background:#0c1525D9;border:1px solid #334760;border-radius:10px;padding:7px 9px;font-size:11px;color:#c5d2e5;z-index:3}
footer{height:48px;background:#111b2e;border-top:1px solid #2b3b55;display:flex;align-items:center;gap:7px;padding:6px 9px;overflow:auto;z-index:5}
footer button{white-space:nowrap;padding:7px 10px;font-size:12px}
#file{display:none}
@media(max-width:650px){
 header{height:52px}.logo{font-size:14px}.top-actions button{padding:8px;font-size:12px}
 .toolbar{top:auto;bottom:10px;left:10px;width:calc(100% - 20px);max-height:47%;overflow:auto}
 .toolgrid{grid-template-columns:repeat(4,1fr)}.toolgrid button{font-size:11px;padding:8px 3px}
 .panel{top:10px;right:10px;width:calc(100% - 20px);max-height:42%}
}
.country-editor{top:auto;bottom:58px;right:10px;max-height:55%;z-index:6}
.country-editor input,.country-editor select{width:100%;background:#17243a;color:white;border:1px solid #344863;border-radius:8px;padding:8px}
@media(max-width:650px){.country-editor{bottom:58px;top:auto;max-height:55%}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">🗺️ World<span>Forge</span> <small style="font-weight:700;color:#fbbf24">OFFICIAL</small></div>
  <div class="top-actions">
    <button id="random" class="primary">🎲 Random</button>
    <button id="menu">⚙️</button>
  </div>
</header>
<main>
<canvas id="map"></canvas>
<div class="toolbar">
  <div class="toolgrid">
    <button data-tool="pan" class="active">✋ Di chuyển</button>
    <button data-tool="terrain">🌍 Địa hình</button>
    <button data-tool="country">🏳️ Quốc gia</button>
    <button data-tool="label">🏷️ Tên</button>
  </div>
  <div class="control" id="terrainBox">
    <label>Loại địa hình</label>
    <select id="terrainType" style="width:100%;background:#17243a;color:white;border:1px solid #344863;border-radius:8px;padding:8px">
      <option value="ocean">🌊 Đại dương</option><option value="coast">🏖️ Bờ biển</option>
      <option value="plain">🌱 Đồng bằng</option><option value="forest">🌲 Rừng</option>
      <option value="mountain">⛰️ Núi</option><option value="desert">🏜️ Sa mạc</option>
      <option value="tundra">❄️ Băng giá</option><option value="swamp">🐊 Đầm lầy</option>
      <option value="river">💧 Sông</option>
    </select>
  </div>
  <div class="control">
    <label>Kích thước cọ: <b id="sizeVal">35</b></label>
    <input id="size" type="range" min="5" max="150" value="35">
  </div>
  <div class="control">
    <label>Màu</label><input id="color" type="color" value="#e85d75">
  </div>
  <div class="control" id="countryModeBox" style="display:none">
    <label>Biên giới quốc gia</label>
    <div class="row">
      <button id="landBorder" class="primary">🟫 Đất liền</button>
      <button id="seaBorder">🌊 Biển</button>
    </div>
    <div class="small" style="margin-top:6px">Đất liền chỉ sửa trên vùng có đất. Muốn sửa ranh giới trên biển phải bật nút Biển.</div>
  </div>
  <div class="control" id="nameBox" style="display:none">
    <label>Tên quốc gia / địa danh</label>
    <input id="name" placeholder="Ví dụ: Greenford">
  </div>
</div>
<div id="panel" class="panel">
 <h3>⚙️ Bảng điều khiển</h3>
 <div class="row"><button id="undo">↶ Hoàn tác</button><button id="redo">↷ Làm lại</button></div>
 <div class="row" style="margin-top:6px"><button id="clear">🗑️ Xóa</button><button id="fit">⛶ Toàn bản đồ</button></div>
 <div class="control"><label>Hiển thị lưới</label><div class="switch"><input id="grid" type="checkbox"><span>Bật lưới tọa độ</span></div></div>
 <div class="control"><label>Độ trong suốt quốc gia</label><input id="alpha" type="range" min="20" max="100" value="72"></div>
  <div class="control"><div class="switch"><input id="battery" type="checkbox" checked><span>🔋 Chế độ tiết kiệm pin</span></div><div class="small">Giảm số lần vẽ lại khi kéo/cọ.</div></div>
 <div class="control"><button id="export" style="width:100%">🖼️ Xuất PNG</button></div>
 <div class="control"><button id="save" style="width:100%">💾 Lưu thế giới JSON</button></div>
 <div class="control"><button id="restoreAuto" style="width:100%">↩️ Khôi phục tự động lưu</button></div>
 <div class="control"><label>Nạp thế giới JSON</label><input id="file" type="file" accept=".json,application/json"><label class="filelabel" for="file" style="display:block;text-align:center">📂 Chọn file</label></div>
 <p class="small">Được tối ưu cho điện thoại: chế độ tiết kiệm pin luôn được ưu tiên.</p>
</div>
<div class="status" id="status">Sẵn sàng</div>
</main>
<div id="countryEditor" class="panel country-editor"></div>
<footer>
 <button id="ocean">🌊 Biển</button><button id="land">🌱 Đất</button><button id="mountain">⛰️ Núi</button>
 <button id="countryQuick">🏳️ Quốc gia</button><button id="labelQuick">🏷️ Nhãn</button>
</footer>
</div>
<script>
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d',{alpha:false});
const W=800,H=500;
let dpr=1,scale=1,ox=0,oy=0,tool='pan',drawing=false,last=null;
let terrain=new Uint8Array(W*H),country=new Uint16Array(W*H),labels=[];
let countries=[{id:0,name:'',color:'#000000'}],undoStack=[],redoStack=[],stateBefore=null,nextCountry=1;
let borderMode='land',selectedCountry=0,renderPending=false,lastRender=0;
const T={ocean:0,coast:1,plain:2,forest:3,mountain:4,desert:5,tundra:6,swamp:7,river:8};
let countryById=new Map();
function rebuildCountryIndex(){countryById=new Map(countries.map(c=>[Number(c.id),c]))}
const TC=['#79b7e5','#d9c58b','#86bd68','#3d8a55','#777b83','#d8b56c','#cfe7ed','#668c67','#4a9bd1'];
const $=id=>document.getElementById(id);

function resize(){dpr=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.floor(innerWidth*dpr);canvas.height=Math.floor(innerHeight*dpr);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);scheduleDraw(true)}
addEventListener('resize',resize);
function idx(x,y){return y*W+x}
function snapshot(){return{terrain:Array.from(terrain),country:Array.from(country),labels:JSON.parse(JSON.stringify(labels)),countries:JSON.parse(JSON.stringify(countries)),nextCountry}}
function restore(s){terrain=Uint8Array.from(s.terrain);country=Uint16Array.from(s.country);labels=s.labels||[];countries=s.countries||[{id:0,name:'',color:'#000'}];nextCountry=s.nextCountry||countries.length;rebuildCountryIndex();scheduleDraw(true)}
function beginEdit(){if(!stateBefore)stateBefore=snapshot()}
function commit(){if(!stateBefore)return;undoStack.push(stateBefore);if(undoStack.length>12)undoStack.shift();redoStack=[];stateBefore=null;autosave()}
function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));$('nameBox').style.display=t==='label'?'block':'none';$('terrainBox').style.display=t==='terrain'?'block':'none';$('countryModeBox').style.display=t==='country'?'block':'none';status()}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
$('size').oninput=e=>$('sizeVal').textContent=e.target.value;
$('menu').onclick=()=>$('panel').classList.toggle('open');
$('battery').onchange=()=>scheduleDraw(true);

function screenToWorld(x,y){return[(x-ox)/scale,(y-oy)/scale]}
function isLand(i){return terrain[i]!==T.ocean}
function selected(){return countries.find(c=>c.id===selectedCountry)||null}
function currentCountry(){
 let c=$('color').value.toLowerCase(),found=countries.find(x=>x.id>0&&x.color.toLowerCase()===c);
 if(found)return found.id;
 let id=nextCountry++;countries.push({id,name:'Quốc gia '+id,color:c});return id
}
function paint(x,y){
 let [wx,wy]=screenToWorld(x,y),r=Math.max(2,+$('size').value/2);
 if(wx<0||wy<0||wx>=W||wy>=H)return;
 let x0=Math.max(0,Math.floor(wx-r)),x1=Math.min(W-1,Math.ceil(wx+r)),y0=Math.max(0,Math.floor(wy-r)),y1=Math.min(H-1,Math.ceil(wy+r));
 const cid=selectedCountry||currentCountry();
 for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++){
  if((xx-wx)**2+(yy-wy)**2>=r*r)continue;
  let i=idx(xx,yy);
  if(tool==='terrain')terrain[i]=T[$('terrainType').value];
  if(tool==='country'&&cid){
    if(borderMode==='land'&&!isLand(i))continue;
    if(borderMode==='sea'&&isLand(i))continue;
    country[i]=cid;
  }
 }
 scheduleDraw()
}
function pointerPos(e){let r=canvas.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
function pickCountry(x,y){
 let [wx,wy]=screenToWorld(x,y),xx=Math.floor(wx),yy=Math.floor(wy);
 if(xx<0||yy<0||xx>=W||yy>=H)return 0;
 return country[idx(xx,yy)]||0
}
canvas.addEventListener('pointerdown',e=>{
 canvas.setPointerCapture(e.pointerId);let p=pointerPos(e);last=p;
 if(tool==='pan'){drawing=true;let cid=pickCountry(...p);if(cid){openCountryEditor(cid)}else{$('countryEditor').classList.remove('open')}}
 else {drawing=true;beginEdit();
 if(tool==='label'){let n=$('name').value.trim()||'Địa danh',[x,y]=screenToWorld(...p);labels.push({x,y,text:n,color:$('color').value,size:Math.max(12,+$('size').value)});drawing=false;commit();scheduleDraw(true)}
 else {paint(...p)}
 });
canvas.addEventListener('pointermove',e=>{
 if(!drawing)return;let p=pointerPos(e);
 if(tool==='pan'){ox+=p[0]-last[0];oy+=p[1]-last[1];last=p;scheduleDraw()}
 else {paint(...p);last=p}
});
canvas.addEventListener('pointerup',()=>{if(drawing){drawing=false;commit();scheduleDraw(true)}});
canvas.addEventListener('pointercancel',()=>{drawing=false;stateBefore=null});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false});

function zoomAt(f,cx,cy){let[wx,wy]=screenToWorld(cx,cy);scale=Math.max(.35,Math.min(5,scale*f));ox=cx-wx*scale;oy=cy-wy*scale;scheduleDraw(true)}
function scheduleDraw(force=false){
 const now=performance.now(),battery=$('battery')?.checked!==false;
 if(battery&&!force&&now-lastRender<45){if(renderPending)return;renderPending=true;requestAnimationFrame(()=>{renderPending=false;scheduleDraw(true)});return}
 lastRender=now;draw()
}
function draw(){
 ctx.clearRect(0,0,innerWidth,innerHeight);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);
 const img=ctx.createImageData(W,H),d=img.data,alpha=+$('alpha').value/100;
 for(let i=0;i<W*H;i++){
   let tc=hex(TC[terrain[i]]),c=country[i]?countryById.get(country[i]):null;
   if(c){let cc=hex(c.color);d[i*4]=Math.round(tc[0]*(1-alpha)+cc[0]*alpha);d[i*4+1]=Math.round(tc[1]*(1-alpha)+cc[1]*alpha);d[i*4+2]=Math.round(tc[2]*(1-alpha)+cc[2]*alpha)}
   else{d[i*4]=tc[0];d[i*4+1]=tc[1];d[i*4+2]=tc[2]}
   d[i*4+3]=255
 }
 ctx.putImageData(img,0,0);
 if($('grid').checked){ctx.strokeStyle='#ffffff22';ctx.lineWidth=1/scale;ctx.beginPath();for(let x=0;x<=W;x+=50){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=0;y<=H;y+=50){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke()}
 for(const l of labels){ctx.fillStyle=l.color;ctx.font='700 '+l.size+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeStyle='#000b';ctx.lineWidth=Math.max(2,l.size/5);ctx.strokeText(l.text,l.x,l.y);ctx.fillText(l.text,l.x,l.y)}
 ctx.restore();status()
}
function hex(s){s=s.replace('#','');return[parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)]}
function status(){$('status').textContent=''+({pan:'Chọn quốc gia / di chuyển',terrain:'Địa hình',country:'Biên giới '+(borderMode==='land'?'đất liền':'biển'),label:'Tên'}[tool])+' • '+Math.round(scale*100)+'%'}
function openCountryEditor(id){
 selectedCountry=id;let c=selected();if(!c)return;
 $('countryEditor').innerHTML='<h3>🏳️ '+escapeHtml(c.name)+'</h3>'+
 '<div class="small">Đang chọn quốc gia #'+id+'</div>'+
 '<div class="control"><label>Tên quốc gia</label><input id="editCountryName" value="'+escapeAttr(c.name)+'"></div>'+
 '<div class="control"><label>Màu quốc gia</label><input id="editCountryColor" type="color" value="'+c.color+'"></div>'+
 '<div class="row"><button id="applyCountry" class="primary">✓ Áp dụng</button><button id="editBorders">🛠️ Biên giới</button></div>'+
 '<div class="row" style="margin-top:6px"><button id="landOnly">🟫 Chỉ đất</button><button id="seaOnly">🌊 Chỉ biển</button></div>'+
 '<p class="small">Khi chỉnh biên giới: Đất liền chỉ tác động lên ô có địa hình đất; Biển chỉ tác động lên ô đại dương.</p>';
 $('countryEditor').classList.add('open');
 $('applyCountry').onclick=()=>{c.name=$('editCountryName').value.trim()||c.name;c.color=$('editCountryColor').value; $('color').value=c.color; scheduleDraw(true);openCountryEditor(id)};
 $('editBorders').onclick=()=>{setTool('country');$('countryEditor').classList.remove('open')};
 $('landOnly').onclick=()=>{setTool('country');borderMode='land';$('countryEditor').classList.remove('open')};
 $('seaOnly').onclick=()=>{setTool('country');borderMode='sea';$('countryEditor').classList.remove('open')};
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function escapeAttr(v){return escapeHtml(v)}
$('landBorder').onclick=()=>{borderMode='land';setTool('country')}
$('seaBorder').onclick=()=>{borderMode='sea';setTool('country')}
$('undo').onclick=()=>{if(!undoStack.length)return;redoStack.push(snapshot());restore(undoStack.pop())};
$('redo').onclick=()=>{if(!redoStack.length)return;undoStack.push(snapshot());restore(redoStack.pop())};
$('clear').onclick=()=>{if(!confirm('Xóa toàn bộ thế giới?'))return;beginEdit();terrain.fill(0);country.fill(0);labels=[];countries=[{id:0,name:'',color:'#000'}];nextCountry=1;rebuildCountryIndex();commit();scheduleDraw(true)};
$('fit').onclick=()=>{scale=Math.min(innerWidth/W,innerHeight/H)*.96;ox=(innerWidth-W*scale)/2;oy=(innerHeight-H*scale)/2;scheduleDraw(true)};
$('grid').onchange=()=>scheduleDraw(true);$('alpha').oninput=()=>scheduleDraw(true);

function randomWorld(){
 beginEdit();terrain.fill(0);country.fill(0);labels=[];countries=[{id:0,name:'',color:'#000'}];nextCountry=1;
 const seeds=[];for(let i=0;i<12;i++)seeds.push({x:40+Math.random()*(W-80),y:35+Math.random()*(H-70),r:35+Math.random()*95});
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){let best=1e9;for(const s of seeds){let dx=(x-s.x)/1.3,dy=y-s.y;best=Math.min(best,dx*dx+dy*dy)}if(best<95*95){let n=Math.random();terrain[idx(x,y)]=n<.05?4:n<.14?3:n<.20?5:n<.24?7:2}}
 for(let i=0;i<10;i++){let id=nextCountry++,color='hsl('+Math.floor(Math.random()*360)+' 65% 55%)';countries.push({id,name:'Quốc gia '+id,color})}
 rebuildCountryIndex();
 // Contiguous-ish assignment from nearest country seeds, much cheaper than per-country scanning.
 const cs=countries.slice(1).map(c=>({id:c.id,x:Math.random()*W,y:Math.random()*H}));
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){let ti=idx(x,y);if(!isLand(ti))continue;let best=1e9,bid=0;for(const q of cs){let d=(x-q.x)**2+(y-q.y)**2;if(d<best){best=d;bid=q.id}}country[ti]=bid}
 for(let i=1;i<nextCountry;i++){let x=60+Math.random()*(W-120),y=50+Math.random()*(H-100);labels.push({x,y,text:countries[i].name,color:'#fff',size:14+Math.random()*10})}
 commit();$('fit').click()
}
$('random').onclick=randomWorld;
$('ocean').onclick=()=>{setTool('terrain');$('terrainType').value='ocean'};
$('land').onclick=()=>{setTool('terrain');$('terrainType').value='plain'};
$('mountain').onclick=()=>{setTool('terrain');$('terrainType').value='mountain'};
$('countryQuick').onclick=()=>setTool('country');
$('labelQuick').onclick=()=>setTool('label');
$('export').onclick=()=>{let a=document.createElement('a');a.download='worldforge-map.png';a.href=canvas.toDataURL('image/png');a.click()};
function worldData(){return{version:3,official:true,width:W,height:H,terrain:Array.from(terrain),country:Array.from(country),labels,countries,nextCountry}}
function autosave(){try{localStorage.setItem('worldforge-official-autosave',JSON.stringify(worldData()))}catch(e){}}
$('save').onclick=()=>{let blob=new Blob([JSON.stringify(worldData(),null,2)],{type:'application/json'});let a=document.createElement('a');a.download='worldforge-world.json';a.href=URL.createObjectURL(blob);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('restoreAuto').onclick=()=>{try{let raw=localStorage.getItem('worldforge-official-autosave');if(!raw){alert('Chưa có bản tự động lưu.');return}let s=JSON.parse(raw);applyWorld(s);scheduleDraw(true)}catch(e){alert('Bản tự động lưu không hợp lệ.')}};
function applyWorld(s){if(!s||s.width!==W||s.height!==H||!Array.isArray(s.terrain)||!Array.isArray(s.country)||s.terrain.length!==W*H||s.country.length!==W*H)throw new Error('Kích thước hoặc dữ liệu bản đồ không hợp lệ');terrain=Uint8Array.from(s.terrain);country=Uint16Array.from(s.country);labels=Array.isArray(s.labels)?s.labels:[];countries=Array.isArray(s.countries)&&s.countries.length? s.countries:[{id:0,name:'',color:'#000'}];nextCountry=Number(s.nextCountry)||Math.max(1,...countries.map(c=>Number(c.id)||0))+1;selectedCountry=0;rebuildCountryIndex()}
$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let s=JSON.parse(r.result);beginEdit();applyWorld(s);commit();scheduleDraw(true);autosave()}catch(err){alert('File JSON không hợp lệ hoặc không đúng kích thước bản đồ.')}};r.readAsText(f)};
function init(){scale=Math.min(innerWidth/W,innerHeight/H)*.96;ox=(innerWidth-W*scale)/2;oy=(innerHeight-H*scale)/2;resize();randomWorld();setTool('pan')}
rebuildCountryIndex();
init();
</script>
</body></html>
